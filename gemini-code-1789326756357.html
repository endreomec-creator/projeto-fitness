<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projeto Fitness - Sincronizado</title>
<style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .status-loading { color: #38bdf8; font-weight: bold; }
</style>
</head>
<body>

<div id="status" class="status-loading">🔄 Sincronizando com a planilha...</div>

<script>
    // Cole aqui a URL do seu Google Apps Script!
    const SCRIPT_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";

    // Envia dados para o Google Sheets ao clicar na caixa
    async function syncCheckToSheets(slotId, person, activityType, isChecked) {
        document.getElementById("status").innerText = "⏳ Salvando na nuvem...";
        const now = new Date();
        const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        const payload = {
            action: isChecked ? "save" : "clear",
            slotId: slotId,
            person: person,
            type: activityType,
            date: now.toISOString(),
            monthKey: currentMonthKey,
            checked: isChecked
        };

        await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });

        document.getElementById("status").innerText = "✅ Sincronizado!";
    }
</script>
</body>
</html>
